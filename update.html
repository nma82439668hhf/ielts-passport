<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f2f7"><title>更新页面 · IELTS Passport</title><script src="theme.js?v=1.2.3"></script><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c1c1e;background:#f2f2f7;color-scheme:light}:root[data-theme=dark]{color:#fff;background:#000;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px}main{max-width:480px;width:100%}h1{font-size:32px;line-height:1.25;letter-spacing:-.025em;margin:32px 0 16px}p{font-size:17px;line-height:1.6}progress{width:100%;height:8px;accent-color:#006add;margin:20px 0}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:999px;font:inherit;font-size:16px;font-weight:600;line-height:1.4;border:0;background:#006add;color:#fff;text-decoration:none;cursor:pointer}button{font-family:inherit;font-size:16px;margin-right:12px}a:focus-visible,button:focus-visible{outline:3px solid #0a84ff;outline-offset:4px}.note{font-size:13px;line-height:1.6;margin-top:40px}[hidden]{display:none!important}
</style></head><body><main><strong>IELTS Passport</strong><h1>正在更新页面…</h1><p id="update-status" role="status" aria-live="polite">学习记录会保留。完成后自动返回学习。</p><progress id="update-progress" aria-label="页面更新进度"></progress><div><button id="retry" type="button" hidden>重试更新</button><a href="./">返回学习</a></div><noscript><p>请启用 JavaScript 后重试更新，或使用“返回学习”打开工作台。</p></noscript><p class="note">Vega · 未经允许禁止用于一切商业用途</p></main><script>
(()=>{'use strict';const status=document.querySelector('#update-status'),progress=document.querySelector('#update-progress'),retry=document.querySelector('#retry');let busy=false;
function activated(reg){return new Promise((resolve,reject)=>{const worker=reg.installing||reg.waiting||reg.active;if(!worker){reject(Error('no worker'));return;}const timer=setTimeout(()=>finish(Error('timeout')),20000);function finish(error){clearTimeout(timer);worker.removeEventListener('statechange',changed);error?reject(error):resolve();}function changed(){if(worker.state==='activated')finish();else if(worker.state==='redundant')finish(Error('replaced'));}worker.addEventListener('statechange',changed);changed();});}
function timed(promise,ms){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('timeout')),ms);})]).finally(()=>clearTimeout(timer));}
async function run(){if(busy)return;busy=true;retry.hidden=true;progress.hidden=false;progress.removeAttribute('value');status.textContent='正在获取最新页面，学习记录会保留…';const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),45000);try{
 if('serviceWorker'in navigator){try{const reg=await timed(navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}),15000);await timed(reg.update(),15000);await activated(reg);}catch(_){/* Refresh HTTP resources even when offline storage is unavailable. */}}
 const response=await fetch('index.html',{cache:'reload',signal:abort.signal});if(!response.ok)throw Error('page');const doc=new DOMParser().parseFromString(await response.text(),'text/html'),urls=[...doc.querySelectorAll('script[src],link[rel=stylesheet][href]')].map(el=>new URL(el.getAttribute('src')||el.getAttribute('href'),location.href)).filter(url=>url.origin===location.origin);progress.max=urls.length;progress.value=0;
 await Promise.all(urls.map(async url=>{const r=await fetch(url,{cache:'reload',signal:abort.signal});if(!r.ok)throw Error('resource');await r.arrayBuffer();progress.value++;status.textContent=`正在更新 ${progress.value} / ${urls.length} 项，学习记录会保留…`;}));const version=await fetch('version.json',{cache:'reload',signal:abort.signal});if(!version.ok)throw Error('version');const data=await version.json();status.textContent='更新完成，正在返回学习…';location.replace('./?updated='+encodeURIComponent(data.webVersion));
 }catch(_){abort.abort();status.textContent='更新未完成，学习记录仍保留。请检查网络后重试。';retry.hidden=false;progress.hidden=true;}finally{clearTimeout(timer);busy=false;}}
retry.addEventListener('click',run);run();})();
</script></body></html>
