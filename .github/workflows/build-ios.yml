name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and generate iOS project
        run: |
          pnpm --dir apps/mobile install --no-frozen-lockfile
          pnpm --dir apps/mobile prepare:web
          cd apps/mobile
          pnpm exec cap add ios
          cd ../..
          node scripts/configure-native-app.mjs ios
      - name: Build unsigned iOS app
        run: |
          cd apps/mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr IELTS-Passport-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: apps/mobile/ios/App/IELTS-Passport-unsigned.ipa
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: get_version
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: release
      - name: Rename iOS IPA
        run: mv release/IELTS-Passport-unsigned.ipa "release/IELTS-Passport-iOS-Unsigned-${{ steps.get_version.outputs.version }}.ipa"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: IELTS Passport v${{ steps.get_version.outputs.version }}
          body: Unsigned iOS IPA with hybrid cloud update, WeChat/QQ login support, Vega authorship notice and support QR. Apple signing is required for installation on a device.
          files: release/*.ipa
          make_latest: true
