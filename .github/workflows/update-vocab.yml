name: Update vocabulary bank

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download sources and rebuild vocabulary
        run: node scripts/update-vocab-from-github.js
        env:
          SITE_DATA_DIR: ${{ github.workspace }}/data

      - name: Commit updated vocabulary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update vocabulary bank from GitHub sources"
          git push
