name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: app-release-v1.0.1
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            artifact: desktop-windows
          - os: macos-latest
            command: dist:mac
            artifact: desktop-macos
          - os: ubuntu-latest
            command: dist:linux
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pnpm --dir apps/desktop install --no-frozen-lockfile
      - name: Build package
        run: pnpm --dir apps/desktop ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/dist/**
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Normalize desktop asset names
        run: |
          mkdir -p release
          cp "artifacts/IELTS Passport Setup 1.0.1.exe" release/IELTS-Passport-Windows-Setup-1.0.1.exe
          cp "artifacts/IELTS Passport-1.0.1-arm64.dmg" release/IELTS-Passport-macOS-arm64-1.0.1.dmg
          cp "artifacts/IELTS Passport-1.0.1.AppImage" release/IELTS-Passport-Linux-1.0.1.AppImage
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: IELTS Passport v1.0.1
          body: Desktop apps with hybrid cloud update, WeChat/QQ login support, Vega authorship notice and support QR.
          files: release/*
          make_latest: true
