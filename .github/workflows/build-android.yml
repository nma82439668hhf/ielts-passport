name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare native Android project
        run: |
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir apps/mobile prepare:web
          cd apps/mobile
          pnpm exec cap add android
          cd ../..
          node scripts/configure-native-app.mjs android
      - name: Build debug signed APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify signature and embedded website version
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          test "$(unzip -p "$APK" assets/public/version.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["webVersion"])')" = "$VERSION"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
