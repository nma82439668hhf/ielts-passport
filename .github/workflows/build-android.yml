name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies and generate Android project
        run: |
          pnpm --dir apps/mobile install --no-frozen-lockfile
          pnpm --dir apps/mobile prepare:web
          cd apps/mobile
          pnpm exec cap add android
      - name: Build debug APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: release
      - name: Rename Android APK
        run: mv release/app-debug.apk release/IELTS-Passport-Android-Debug-1.0.1.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: IELTS Passport v1.0.1
          body: Android APK with hybrid cloud update, WeChat/QQ login support, Vega authorship notice and support QR.
          files: release/*.apk
          make_latest: true
